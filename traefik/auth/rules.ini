default-action = auth

# traefik-forward-auth registers every rule with the same priority (1), so when
# two rules match the same request, which one wins depends on a random map
# iteration order at container start. Making a rule string longer does NOT
# raise its priority. The rules below are therefore written so they never
# overlap:
#
# - "loggedin" (action auth) handles every request that carries the
#   authentication cookie, so traefik-forward-auth validates it and sends the
#   X-Forwarded-User header. Paths starting with "_" are excluded so the
#   /_oauth callback and /_oauth/logout handlers are not replaced.
# - All "allow" rules only match requests WITHOUT the authentication cookie.
#
# When adding a new allow rule, keep the leading
#   !HeadersRegexp("cookie", ".*_forward_auth=.*") && ( ... )
# so it cannot shadow "loggedin".

rule.loggedin.action = auth
rule.loggedin.rule = HeadersRegexp("cookie", ".*_forward_auth=.*") && Path("/{path:$|[^_].*$}")

rule.main.action = allow
rule.main.rule = !HeadersRegexp("cookie", ".*_forward_auth=.*") && (Path("/") || PathPrefix("/static/") || Path("/index/") || PathPrefix("/archive") || PathPrefix("/overview/") || PathPrefix("/session/") || PathPrefix("/generate_cache_page/") || PathPrefix("/healthcheck") || PathPrefix("/get_cached_text/"))

rule.ltapi.action = allow
rule.ltapi.rule = !HeadersRegexp("cookie", ".*_forward_auth=.*") && (PathPrefix("/ltapi/{session:[0-9]+}/getgraph") || PathPrefix("/ltapi/stream") || PathPrefix("/ltapi/{session:[0-9]+}/{stream:[a-zA-Z0-9_]+}/get_output_language_component") || PathPrefix("/ltapi/{session:[0-9]+}/get_previous_messages") || PathPrefix("/ltapi/do_urlshortening") || PathPrefix("/ltapi/shorten"))

rule.openapi.action = allow
rule.openapi.rule = !HeadersRegexp("cookie", ".*_forward_auth=.*") && (PathPrefix("/flasgger_static/") || PathPrefix("/apidocs/") || PathPrefix("/ltapi/apidocs/"))
